<div class="modal-header">
  <h4 class="modal-title">Change status · Order <span class="mono">#{{ order.id }}</span></h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="modalRef.hide()"></button>
</div>
<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="modal-body">
    <div class="alert-x danger mb-3" *ngIf="error"><i class="bi bi-exclamation-circle"></i><span>{{ error }}</span></div>

    <div class="d-flex align-items-center gap-2 mb-3 small text-muted-x">
      Current status <app-status-badge [status]="order.status"></app-status-badge>
    </div>

    <span class="form-label d-block">Move to</span>
    <div class="target-list mb-3" role="radiogroup" aria-label="Target status">
      <button type="button" *ngFor="let s of options" class="target" role="radio"
              [attr.aria-checked]="form.controls.status.value === s"
              [class.active]="form.controls.status.value === s" (click)="select(s)"
              [style.--c]="statusMeta(s).color">
        <i class="bi {{ statusMeta(s).icon }}"></i>
        <span><strong>{{ statusMeta(s).label }}</strong><small>{{ statusMeta(s).description }}</small></span>
      </button>
    </div>

    <label class="form-label" for="reason">Reason <span class="text-muted-x fw-normal">(optional)</span></label>
    <textarea id="reason" rows="3" class="form-control" formControlName="reason" maxlength="500"
              placeholder="Shown in the audit trail, analytics and customer email"></textarea>
    <div class="d-flex justify-content-between mt-2 gap-2 flex-wrap">
      <div class="d-flex gap-1 flex-wrap">
        <button type="button" class="chip" *ngFor="let p of presets" (click)="usePreset(p)" style="cursor:pointer">{{ p }}</button>
      </div>
      <small class="text-muted-x">{{ reasonLength }}/500</small>
    </div>
    <p class="small text-muted-x mt-3 mb-0"><i class="bi bi-person-badge"></i> Recorded as changed by <strong>{{ auth.email }}</strong></p>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-soft" (click)="modalRef.hide()">Cancel</button>
    <button type="submit" class="btn btn-primary" [disabled]="submitting || !form.controls.status.value">
      <span *ngIf="submitting" class="spinner-border spinner-border-sm me-2"></span>Update status
    </button>
  </div>
</form>
