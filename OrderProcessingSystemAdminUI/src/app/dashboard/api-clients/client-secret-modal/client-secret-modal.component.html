<div class="modal-header">
  <h4 class="modal-title"><i class="bi bi-check-circle-fill text-success me-2"></i>{{ title }}</h4>
</div>
<div class="modal-body">
  <div class="alert-x warning mb-3">
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span><strong>Copy the secret now.</strong> It is not recoverable and can only be replaced by rotating it.</span>
  </div>

  <label class="form-label" for="client-id-out">Client ID</label>
  <div class="input-group mb-3">
    <input id="client-id-out" class="form-control mono" readonly [value]="credentials.client.clientId">
    <button type="button" class="btn btn-soft" (click)="copy('id')"><i class="bi" [class.bi-copy]="copied !== 'id'" [class.bi-check2]="copied === 'id'"></i></button>
  </div>

  <label class="form-label" for="client-secret-out">Client secret</label>
  <div class="input-group mb-3">
    <input id="client-secret-out" class="form-control mono" readonly [type]="revealed ? 'text' : 'password'" [value]="credentials.clientSecret">
    <button type="button" class="btn btn-soft" (click)="revealed = !revealed" [attr.aria-label]="revealed ? 'Hide secret' : 'Show secret'">
      <i class="bi" [class.bi-eye]="!revealed" [class.bi-eye-slash]="revealed"></i></button>
    <button type="button" class="btn btn-soft" (click)="copy('secret')"><i class="bi" [class.bi-copy]="copied !== 'secret'" [class.bi-check2]="copied === 'secret'"></i></button>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-1">
    <span class="form-label mb-0">Get a token</span>
    <button type="button" class="btn btn-sm btn-link p-0 text-decoration-none" (click)="copy('curl')">{{ copied === 'curl' ? 'Copied!' : 'Copy' }}</button>
  </div>
  <pre class="code-block" *ngIf="revealed; else hiddenCurl">{{ curl }}</pre>
  <ng-template #hiddenCurl><pre class="code-block">curl -s -X POST {{ tokenUrl }} -u '&lt;client_id&gt;:&lt;secret&gt;' -d grant_type=client_credentials</pre></ng-template>

  <div class="form-check mt-3">
    <input class="form-check-input" type="checkbox" id="ack" [checked]="acknowledged" (change)="acknowledged = !acknowledged">
    <label class="form-check-label small" for="ack">I have stored the secret somewhere safe</label>
  </div>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-primary" [disabled]="!acknowledged" (click)="modalRef.hide()">Done</button>
</div>
